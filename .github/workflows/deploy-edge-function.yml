name: Deploy API (Supabase Edge Function)

# The whole backend is a Supabase Edge Function: no server, no laptop, no second
# platform. Push to main and the API is republished, the same way Pages
# republishes the website. The website and the API therefore always match.
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "api/**"
      - "runtime/**"
      - "supabase/**"
      - "scripts/build-edge-function.mjs"
      - ".github/workflows/deploy-edge-function.yml"
  workflow_dispatch:

concurrency:
  group: deploy-edge-function
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: nroosqwxyhkavdokxahn
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # esbuild is a devDependency, so the lockfile decides its version and the
      # install cannot drift from what a website build uses.
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Bundle the function
        run: node scripts/build-edge-function.mjs

      - name: Fail if the bundle still needs a Node-only module
        run: |
          if grep -nE '^import[^;]*["'"'"'](pg|@libsql/client)["'"'"']' supabase/functions/jatext-api/index.ts; then
            echo "The Edge Function must not statically import pg or @libsql/client." >&2
            exit 1
          fi

      # `latest` means the action asks GitHub's API for the newest release, and that
      # anonymous lookup gets rate limited (run #7 died here, before deploying
      # anything). Authenticate it, and if it still fails, install the same CLI from
      # npm: that package downloads its binary by tag, which is not API limited.
      - uses: supabase/setup-cli@v1
        id: cli
        continue-on-error: true
        with:
          version: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the Supabase CLI from npm instead
        if: steps.cli.outcome != 'success'
        run: |
          npm install --no-save --no-package-lock supabase@latest
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      # A missing token is a configuration gap, not a broken build. Skipping here
      # keeps a red X off main for people who have not added the secret yet.
      # The runner log is only reachable through a blob host the agent cannot
      # fetch, so the CLI output is promoted into a check annotation instead:
      # `gh api repos/<owner>/<repo>/check-runs/<id>/annotations` shows exactly why
      # a deploy failed without anyone opening the dashboard.
      - name: Publish
        if: env.SUPABASE_ACCESS_TOKEN != ''
        timeout-minutes: 6
        run: |
          set +e
          if ! command -v supabase >/dev/null 2>&1; then
            echo "::error title=Supabase CLI missing::neither install path produced a supabase binary"
            exit 1
          fi
          # --yes is not decoration: since CLI v3 a non-interactive stdout makes the
          # command refuse to apply anything ("Confirmation required ... Nothing was
          # changed") and exit 1, which looks exactly like a bundling failure.
          supabase functions deploy jatext-api --no-verify-jwt --project-ref "$PROJECT_REF" --yes > /tmp/deploy.log 2>&1
          CODE=$?
          set -e
          cat /tmp/deploy.log
          if [ "$CODE" -ne 0 ]; then
            python3 - /tmp/deploy.log <<'PY'
          import sys
          text = open(sys.argv[1], errors="replace").read()[-1400:]
          enc = (
              text.replace("%", "%25")
              .replace(":", "%3A")
              .replace(",", "%2C")
              .replace("\n", "%0A")
              .replace("\r", "")
          )
          print("::error title=supabase functions deploy failed::" + enc)
          PY
            exit "$CODE"
          fi

      - name: Notice
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: |
          echo "::notice title=API not deployed::Add the SUPABASE_ACCESS_TOKEN repository secret (GitHub -> Settings -> Secrets and variables -> Actions) so pushes can publish the Edge Function."
