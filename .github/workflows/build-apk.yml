name: Build Android Release APK

on:
  push:
    branches:
      - main
      - "arena/**"
    paths-ignore:
      - "release-cdn/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Restore or cache release keystore
        uses: actions/cache@v4
        with:
          path: android/jatext-release.jks
          key: jatext-release-keystore-v1

      - name: Configure release signing and optional Firebase config
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'JaTextReleaseKey2026!' }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f android/jatext-release.jks ]; then
            keytool -genkeypair -v \
              -keystore android/jatext-release.jks \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias jatext \
              -storepass "${KEYSTORE_PASS}" \
              -keypass "${KEYSTORE_PASS}" \
              -dname "CN=JaText, OU=Mobile, O=JaText, L=KualaLumpur, ST=Selangor, C=MY"
          fi
          printf "storeFile=jatext-release.jks\nstorePassword=%s\nkeyAlias=jatext\nkeyPassword=%s\n" "${KEYSTORE_PASS}" "${KEYSTORE_PASS}" > android/keystore.properties
          if [ -n "${GOOGLE_SERVICES_JSON}" ]; then
            printf "%s\n" "${GOOGLE_SERVICES_JSON}" > android/app/google-services.json
          fi

      - name: Install dependencies and sync Capacitor Android
        run: |
          npm install --legacy-peer-deps
          npm run android:sync

      - name: Assemble Signed Release APK
        working-directory: android
        run: bash ./gradlew assembleRelease --no-daemon

      - name: Prepare Release APK artifact
        run: cp android/app/build/outputs/apk/release/app-release.apk JaText-release.apk

      - name: Upload Release APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: JaText-release-apk
          path: JaText-release.apk

      - name: Publish latest Release APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_CODE=$(grep -oP 'versionCode\s+\K\d+' android/app/build.gradle | head -n 1)
          VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle | head -n 1)
          cp JaText-release.apk /tmp/JaText-release.apk
          base64 -w 0 /tmp/JaText-release.apk > apk.b64
          jq -Rs '{content: ., encoding: "base64"}' apk.b64 > blob_payload.json
          BLOB_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/blobs" --input blob_payload.json --jq .sha)
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest /tmp/JaText-release.apk \
            --title "JaText v${VERSION_NAME} (build ${VERSION_CODE})" \
            --notes "Signed Release APK built from commit ${GITHUB_SHA}. VersionName: ${VERSION_NAME}. VersionCode: ${VERSION_CODE}. Backend: Turso. Blob: ${BLOB_SHA}"

          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            AUTHOR_NAME=$(git log -1 --format='%an')
            AUTHOR_EMAIL=$(git log -1 --format='%ae')
            git config user.name "${AUTHOR_NAME:-Ahad00010}"
            git config user.email "${AUTHOR_EMAIL:-Ahad00010@users.noreply.github.com}"
            git checkout -- .
            git fetch origin main
            git checkout -B main origin/main
            mkdir -p release-cdn
            cp /tmp/JaText-release.apk release-cdn/JaText-release.apk
            PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            jq -n \
              --arg vn "${VERSION_NAME}" \
              --argjson vc "${VERSION_CODE}" \
              --arg url "https://jatext.vercel.app/downloads/JaText-release.apk" \
              --arg sha "${GITHUB_SHA}" \
              --arg at "${PUBLISHED_AT}" \
              '{versionName: $vn, versionCode: $vc, downloadUrl: $url, commitSha: $sha, publishedAt: $at}' \
              > release-cdn/apk-version.json
            git add -f release-cdn/apk-version.json release-cdn/JaText-release.apk
            if ! git diff --cached --quiet; then
              git commit -m "Publish signed Release APK v${VERSION_NAME} (build ${VERSION_CODE}) to public CDN"
              git push origin HEAD:main || true
            fi
          fi
