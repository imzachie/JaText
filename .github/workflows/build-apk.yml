name: Build Android Release APK

on:
  push:
    branches:
      - main
      - "arena/**"
    paths-ignore:
      - "release-cdn/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Restore or cache release keystore
        uses: actions/cache@v4
        with:
          path: android/jatext-release.jks
          key: jatext-release-keystore-v1

      - name: Configure release signing and optional Firebase config
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'JaTextReleaseKey2026!' }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f android/jatext-release.jks ]; then
            keytool -genkeypair -v \
              -keystore android/jatext-release.jks \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias jatext \
              -storepass "${KEYSTORE_PASS}" \
              -keypass "${KEYSTORE_PASS}" \
              -dname "CN=JaText, OU=Mobile, O=JaText, L=KualaLumpur, ST=Selangor, C=MY"
          fi
          FPS=$(keytool -list -v -keystore android/jatext-release.jks -alias jatext -storepass "${KEYSTORE_PASS}" | grep -E "SHA1:|SHA256:" | tr '\n' ' ')
          echo "::notice title=KeystoreFingerprints::${FPS}"
          printf "storeFile=jatext-release.jks\nstorePassword=%s\nkeyAlias=jatext\nkeyPassword=%s\n" "${KEYSTORE_PASS}" "${KEYSTORE_PASS}" > android/keystore.properties
          if [ -n "${GOOGLE_SERVICES_JSON}" ]; then
            printf "%s\n" "${GOOGLE_SERVICES_JSON}" > android/app/google-services.json
          fi

      - name: Restore or cache SF Pro font bundle
        id: sfpro-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/jatext-sf-pro-fonts
          key: jatext-sf-pro-fonts-${{ hashFiles('scripts/fetch-sf-pro-fonts.py') }}

      - name: Fetch and prepare Apple SF Pro fonts from JaText-Essential-Stuff
        run: |
          if [ "${{ steps.sfpro-cache.outputs.cache-hit }}" != "true" ]; then
            python3 -m pip install --user --break-system-packages --quiet fonttools || python3 -m pip install --quiet fonttools
          fi
          python3 scripts/fetch-sf-pro-fonts.py --fetch

      - name: Assemble Pure Native Signed Release APK
        working-directory: android
        run: |
          set +e
          bash ./gradlew assembleRelease --no-daemon > /tmp/gradle.log 2>&1
          CODE=$?
          cat /tmp/gradle.log
          if [ $CODE -ne 0 ]; then
            ERR_1=$(grep -E "^e: |FAILURE:|What went wrong:|^\* | > " /tmp/gradle.log | sed -n '1,18p' | sed 's/%/%25/g; s/\r/%0D/g' | tr '\n' ' ')
            ERR_2=$(grep -E "^e: " /tmp/gradle.log | sed -n '19,36p' | sed 's/%/%25/g; s/\r/%0D/g' | tr '\n' ' ')
            ERR_3=$(grep -E "^e: " /tmp/gradle.log | sed -n '37,54p' | sed 's/%/%25/g; s/\r/%0D/g' | tr '\n' ' ')
            echo "::error title=GradleErrorLines1::${ERR_1}"
            [ -n "${ERR_2}" ] && echo "::error title=GradleErrorLines2::${ERR_2}"
            [ -n "${ERR_3}" ] && echo "::error title=GradleErrorLines3::${ERR_3}"
            exit $CODE
          fi

      - name: Verify Zero WebView / Zero Capacitor in Release APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk JaText-release.apk
          if unzip -l JaText-release.apk | grep -q "assets/public/index.html"; then
            echo "::error title=WebViewCheck::Bundled HTML asset found inside JaText-release.apk!"
            exit 1
          fi
          if unzip -l JaText-release.apk | grep -qi "capacitor"; then
            echo "::error title=CapacitorCheck::Capacitor resource found inside JaText-release.apk!"
            exit 1
          fi
          python3 -c '
          import zipfile, sys
          with zipfile.ZipFile("JaText-release.apk") as z:
              names = z.namelist()
              libs = [n for n in names if n.startswith("lib/")]
              for n in names:
                  if n.startswith("classes") and n.endswith(".dex"):
                      dex = z.read(n)
                      if b"Lcom/getcapacitor/" in dex or b"LJaTextWebView;" in dex or b"Lcom/ahad00010/jatext/JaTextWebView;" in dex:
                          sys.exit("Forbidden Capacitor/JaTextWebView class found in " + n)
              print("Native libs in APK:", libs)
          '
          python3 scripts/fetch-sf-pro-fonts.py --verify-apk JaText-release.apk
          APK_BYTES=$(stat -c%s JaText-release.apk)
          echo "::notice title=PureNativeAPK::Verified pure native Jetpack Compose APK (${APK_BYTES} bytes, arm64-v8a + armeabi-v7a, zero Capacitor, zero WebView code, zero HTML bundle)."

      - name: Upload Release APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: JaText-release-apk
          path: JaText-release.apk

      - name: Publish latest Release APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+|versionCode\s+\K\d+' android/app/build.gradle | head -n 1)
          VERSION_NAME=$(grep -oP 'versionName\s*=?\s*"\K[^"]+' android/app/build.gradle | head -n 1)
          cp JaText-release.apk /tmp/JaText-release.apk
          BLOB_SHA=$(git hash-object /tmp/JaText-release.apk)
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest /tmp/JaText-release.apk \
            --title "JaText v${VERSION_NAME} (build ${VERSION_CODE})" \
            --notes "Pure Native Kotlin + Jetpack Compose Signed Release APK built from commit ${GITHUB_SHA}. VersionName: ${VERSION_NAME}. VersionCode: ${VERSION_CODE}. Backend: Turso. Blob: ${BLOB_SHA}"

          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            AUTHOR_NAME=$(git log -1 --format='%an')
            AUTHOR_EMAIL=$(git log -1 --format='%ae')
            git config user.name "${AUTHOR_NAME:-Ahad00010}"
            git config user.email "${AUTHOR_EMAIL:-Ahad00010@users.noreply.github.com}"
            git checkout -- .
            git fetch origin main
            git checkout -B main origin/main
            mkdir -p release-cdn
            cp /tmp/JaText-release.apk release-cdn/JaText-release.apk
            PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            jq -n \
              --arg vn "${VERSION_NAME}" \
              --argjson vc "${VERSION_CODE}" \
              --arg url "https://jatext.vercel.app/downloads/JaText-release.apk" \
              --arg sha "${GITHUB_SHA}" \
              --arg at "${PUBLISHED_AT}" \
              '{versionName: $vn, versionCode: $vc, downloadUrl: $url, commitSha: $sha, publishedAt: $at}' \
              > release-cdn/apk-version.json
            git add -f release-cdn/apk-version.json release-cdn/JaText-release.apk
            if ! git diff --cached --quiet; then
              git commit -m "Publish signed Release APK v${VERSION_NAME} (build ${VERSION_CODE}) to public CDN"
              git push origin HEAD:main || true
            fi
          fi
